name: reverie
version: 0.3.0
description: "Reverie — KnowAll graph memory that dreams. A Neo4j knowledge graph (people, organisations, projects, concepts, meetings) behind the mcp-reverie MCP server, recalled before every turn, plus nightly Dreaming consolidation."
author: KnowAll AI
# No `kind`: Hermes finds memory providers by their register_memory_provider() call and, given no
# kind, records this one as `exclusive` (selected by memory.provider). `kind: memory` was never a
# valid kind and logged "unknown kind 'memory' ... treating as 'standalone'" on every load.
# No pip dependencies: the graph is reached over stdio MCP, not the Neo4j driver.
# Needs the mcp-reverie server >= 0.5.4 on PATH (fuzzy name matching; checked against its
# serverInfo at start-up, with a warning, not a refusal, when it is older).
pip_dependencies: []
external_dependencies:
  - name: reverie
    install: "npm install -g @knowall-ai/reverie@^0.5.4"
    check: "which reverie"
requires_env:
  - NEO4J_PASSWORD
optional_env:
  - NEO4J_URI
  - NEO4J_USERNAME
  - NEO4J_DATABASE
  - REVERIE_EMBEDDINGS
  - REVERIE_EMBEDDING_MODEL
  - REVERIE_MODEL_CACHE
  - REVERIE_EMBED_TIMEOUT_MS
  - REVERIE_LAZY_EMBED_BATCH
  - REVERIE_MAX_PROPERTIES
config:
  server_command:
    description: Command that starts the mcp-reverie MCP server
    default: reverie
  embeddings:
    description: "Embeddings for semantic search: local (default), openai, azure, ollama, voyage or none"
    default: local
  search_mode:
    description: "Recall search mode: hybrid (default; includes fuzzy name matching), keyword or semantic"
    default: hybrid
  similarity_threshold:
    description: Semantic similarity cut-off, 0-1 (server default 0.4)
    default: ""
  recall_limit:
    description: Entities recalled per turn, shared fairly across the names in the prompt
    default: 5
  recall_min_score:
    description: "Lowest relevance score (0-1) a recalled entity needs; 0.5 drops weak semantic matches for common words"
    default: 0.5
  recall_depth:
    description: Relationship hops included with each recalled entity, 0-5
    default: 1
  server_timeout:
    description: Seconds to wait for one MCP tool call
    default: 30
  server_startup_timeout:
    description: Seconds to wait for the MCP handshake (the local embedding model downloads on first use)
    default: 60
  model_cache:
    description: Directory for the local embedding model (REVERIE_MODEL_CACHE)
    default: ""
  dreaming_schedule:
    description: Cron schedule for nightly Dreaming (blank = don't install)
    default: "0 3 * * *"
